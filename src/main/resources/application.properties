spring.application.name=WeatherAPI

# ===== Datasource (H2 en memoria para que arranque sin MySQL) =====
# Si prefieres MySQL, comenta este bloque y descomenta el de abajo.
spring.datasource.url=jdbc:h2:mem:weatherdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 consola web: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA: crea las tablas automáticamente desde las entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

